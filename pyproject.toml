[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ayvu"
version = "0.0.1"
description = "CLI para traduzir EPUBs com tradutor local HTTP, preservando a estrutura do livro."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "S.Ralt" }
]
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
classifiers = [
  "Private :: Do Not Upload"
]
dependencies = [
  "ebooklib>=0.18",
  "beautifulsoup4>=4.12",
  "lxml>=4.9",
  "requests>=2.31",
  "typer>=0.9",
  "rich>=13.0",
  "rapidfuzz>=3.0"
]

[project.optional-dependencies]
desktop = [
  "PySide6-Essentials==6.11.2"
]
dev = [
  "pytest>=7.4",
  "pyyaml>=6.0",
  "import-linter>=2.1"
]

[project.scripts]
ayvu = "ayvu.cli:app"
ayvu-desktop = "ayvu.desktop_bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "core: the tests that pull requests run on GitHub; see CORE_TEST_FILES in tests/conftest.py",
]

# Import contracts for D3 and D11 of docs/architecture/decisions/package-structure.md (REF-03, #271).
# Each ignored import is a violation that exists today, with the issue that removes it. An ignore that no
# longer matches fails the check, so this list can only shrink.
[tool.importlinter]
root_package = "ayvu"

[[tool.importlinter.contracts]]
id = "layers"
name = "D3: one-way layers (docs/architecture/decisions/package-structure.md)"
type = "layers"
containers = ["ayvu"]
exhaustive = true
layers = [
  "(interfaces) : desktop : cli : cli_progress : cli_contracts : cli_composition : desktop_bootstrap",
  "(composition)",
  "(v1)",
  "(recovery)",
  "(translation) : translation_plan : translation_pipeline : translation_engine : translation_document : translation_protection : translation_context : context_execution : context_source : chunking : translate_project : translate_project_composition : translate_batch : translate_batch_composition : batch_output_policy : legacy_translation : preflight : (review) : review_application : review_exchange : review_export : review_import : review_composition",
  "(projects) : project : project_service : project_store : project_schema : project_profiles : project_profile_service : project_profile_store : project_profile_composition : profile_glossary_store",
  "(knowledge) : cache : cache_identity : cache_repository : cache_schema : cache_interchange : cache_legacy_format : cache_legacy_stream : cache_admin : cache_admin_store : cache_admin_v2_store : cache_admin_legacy_store : cache_admin_composition : translation_memory : memory_retrieval : approved_memory : approved_memory_service : approved_memory_store : glossary : glossary_catalog : glossary_catalog_store : glossary_catalog_composition : (providers) : provider : provider_capabilities : provider_discovery : provider_service : provider_network : provider_composition : provider_libretranslate : translator : (formats) : format_adapter : format_service : format_local : epub_archive : epub_format : epub_io : html_structure : html_translate : validation : markdown_writer",
  "(artifacts) : artifact : artifact_service : artifact_store : artifact_destination",
  "(jobs) : job : job_events : job_execution : job_service : job_store : job_recovery : job_recovery_store : resume : legacy_resume",
  "content : content_use_cases : content_composition : provenance : provenance_service : provenance_store : (network) : network_policy : network_http : preferences : preferences_service : preferences_store : config : config_values : (library) : library_service : library_adapters : (application)",
  "kernel",
]
ignore_imports = [
  "ayvu.batch_output_policy -> ayvu.cli_contracts",  # REF-04 (#272): cli_contracts is split by owner
  "ayvu.preflight -> ayvu.cli_contracts",  # REF-04 (#272): cli_contracts is split by owner
  "ayvu.provenance_store -> ayvu.job",  # REF-04 (#272): job primitives move to kernel
  "ayvu.content_composition -> ayvu.epub_format",  # REF-05 (#273): composition moves to composition/
  "ayvu.content_composition -> ayvu.format_local",  # REF-05 (#273): composition moves to composition/
  "ayvu.content_composition -> ayvu.format_service",  # REF-05 (#273): composition moves to composition/
  "ayvu.content_composition -> ayvu.markdown_writer",  # REF-05 (#273): composition moves to composition/
  "ayvu.provider_composition -> ayvu.cli_contracts",  # REF-05 (#273): composition moves to composition/
  "ayvu.translate_project_composition -> ayvu.cli_contracts",  # REF-05 (#273): composition moves to composition/
  "ayvu.html_translate -> ayvu.translation_pipeline",  # REF-06 (#274): v1 moves to v1/
  "ayvu.html_translate -> ayvu.translation_protection",  # REF-06 (#274): v1 moves to v1/
  "ayvu.resume -> ayvu.cli_contracts",  # REF-06 (#274): v1 moves to v1/
  "ayvu.content_use_cases -> ayvu.format_adapter",  # REF-07 (#275): content use cases need a home above formats (open question)
  "ayvu.content_use_cases -> ayvu.format_service",  # REF-07 (#275): content use cases need a home above formats (open question)
  "ayvu.html_structure -> ayvu.translation_protection",  # REF-07 (#275): translation_protection moves to content/protection
  "ayvu.artifact_destination -> ayvu.format_local",  # REF-08 (#276): artifacts call formats through a port
  "ayvu.artifact_destination -> ayvu.format_service",  # REF-08 (#276): artifacts call formats through a port
  "ayvu.job_recovery -> ayvu.translate_project",  # REF-08 (#276): resume orchestration moves to recovery/
  "ayvu.job_recovery_store -> ayvu.artifact",  # REF-08 (#276): resume orchestration moves to recovery/
  "ayvu.job_recovery_store -> ayvu.artifact_store",  # REF-08 (#276): resume orchestration moves to recovery/
  "ayvu.job_recovery_store -> ayvu.project",  # REF-08 (#276): resume orchestration moves to recovery/
  "ayvu.job_recovery_store -> ayvu.project_schema",  # REF-08 (#276): resume orchestration moves to recovery/
  "ayvu.job_recovery_store -> ayvu.project_store",  # REF-08 (#276): resume orchestration moves to recovery/
  "ayvu.job_recovery_store -> ayvu.translate_project",  # REF-08 (#276): resume orchestration moves to recovery/
  "ayvu.provenance_store -> ayvu.job_store",  # REF-08 (#276): decided when jobs moves
  "ayvu.memory_retrieval -> ayvu.translation_plan",  # REF-09 (#277): memory_retrieval moves to translation/stages/
  "ayvu.memory_retrieval -> ayvu.translation_protection",  # REF-09 (#277): memory_retrieval moves to translation/stages/
  "ayvu.epub_io -> ayvu.review_export",  # REF-10 (#278): epub_io is split; review CSV and v1 parts leave formats
  "ayvu.epub_io -> ayvu.review_import",  # REF-10 (#278): epub_io is split; review CSV and v1 parts leave formats
]

