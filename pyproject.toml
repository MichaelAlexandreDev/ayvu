[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ayvu"
version = "0.0.1"
description = "CLI para traduzir EPUBs com tradutor local HTTP, preservando a estrutura do livro."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "S.Ralt" }
]
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
classifiers = [
  "Private :: Do Not Upload"
]
dependencies = [
  "ebooklib>=0.18",
  "beautifulsoup4>=4.12",
  "lxml>=4.9",
  "requests>=2.31",
  "typer>=0.9",
  "rich>=13.0",
  "rapidfuzz>=3.0"
]

[project.optional-dependencies]
desktop = [
  "PySide6-Essentials==6.11.2"
]
dev = [
  "pytest>=7.4",
  "pyyaml>=6.0",
  "import-linter>=2.1"
]

[project.scripts]
ayvu = "ayvu.cli:app"
ayvu-desktop = "ayvu.desktop_bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "core: the tests that pull requests run on GitHub; see CORE_TEST_FILES in tests/conftest.py",
]

# Import contracts for D3 and D11 of docs/architecture/decisions/package-structure.md (REF-03, #271).
# Each ignored import is a violation that exists today, with the issue that removes it. An ignore that no
# longer matches fails the check, so this list can only shrink.
[tool.importlinter]
root_package = "ayvu"

[[tool.importlinter.contracts]]
id = "layers"
name = "D3: one-way layers (docs/architecture/decisions/package-structure.md)"
type = "layers"
containers = ["ayvu"]
exhaustive = true
layers = [
  "(interfaces) : desktop : cli : cli_progress : cli_contracts : desktop_bootstrap",
  "composition",
  "v1",
  "recovery",
  "(translation) : translation_plan : translation_pipeline : translation_engine : translation_document : translation_context : context_execution : context_source : chunking : translate_project : translate_batch : batch_output_policy : preflight : resume_reuse : (review) : review_application : review_exchange : review_export : review_import",
  "projects",
  "preferences",
  "knowledge : (providers) : provider : provider_capabilities : provider_discovery : provider_service : provider_network : provider_libretranslate : provider_session : (formats) : format_adapter : format_service : format_local : epub_archive : epub_format : epub_io : html_structure : validation : markdown_writer",
  "artifacts",
  "provenance",
  "jobs",
  "content : content_use_cases : network : library : (application)",
  "kernel",
]
ignore_imports = [
  "ayvu.recovery.store -> ayvu.v1.resume",  # REF-18 (#286): recovery stops reading the v1 resume file when v1 is retired
  "ayvu.recovery.store -> ayvu.v1.resume_scan",  # REF-18 (#286): recovery stops reading the v1 resume file when v1 is retired
  "ayvu.knowledge.cache.admin -> ayvu.v1.cache_format",  # REF-18 (#286): the v1 cache is retired with v1
  "ayvu.knowledge.cache.admin_store -> ayvu.v1.cache",  # REF-18 (#286): the v1 cache is retired with v1
  "ayvu.knowledge.cache.schema -> ayvu.v1.cache",  # REF-18 (#286): the v1 cache is retired with v1
  "ayvu.epub_io -> ayvu.v1.cache",  # REF-10 (#278): epub_io is split; its v1 parts join v1
  "ayvu.epub_io -> ayvu.v1.html_translate",  # REF-10 (#278): epub_io is split; its v1 parts join v1
  "ayvu.epub_io -> ayvu.v1.translator",  # REF-10 (#278): epub_io is split; its v1 parts join v1
  "ayvu.validation -> ayvu.v1.html_translate",  # REF-10 (#278): extract_visible_text moves to formats
  "ayvu.preflight -> ayvu.v1.cache",  # REF-11 (#279): preflight moves to translation/ with the HTTP client out of v1
  "ayvu.preflight -> ayvu.v1.translator",  # REF-11 (#279): preflight moves to translation/ with the HTTP client out of v1
  "ayvu.provider_libretranslate -> ayvu.v1.translator",  # REF-11 (#279): the LibreTranslate HTTP client moves to providers/
  "ayvu.provider_session -> ayvu.v1.translator",  # REF-11 (#279): the LibreTranslate HTTP client moves to providers/
  "ayvu.content_use_cases -> ayvu.format_adapter",  # REF-07 (#275): content use cases need a home above formats (open question)
  "ayvu.content_use_cases -> ayvu.format_service",  # REF-07 (#275): content use cases need a home above formats (open question)
  "ayvu.epub_io -> ayvu.review_export",  # REF-10 (#278): epub_io is split; review CSV and v1 parts leave formats
  "ayvu.epub_io -> ayvu.review_import",  # REF-10 (#278): epub_io is split; review CSV and v1 parts leave formats
]

[[tool.importlinter.contracts]]
id = "v1-quarantine"
name = "D7: only composition imports v1 (the layers contract covers the modules below it)"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
  "ayvu.desktop",
  "ayvu.cli",
  "ayvu.cli_progress",
  "ayvu.cli_contracts",
  "ayvu.desktop_bootstrap",
]
forbidden_modules = [
  "ayvu.v1",
]

[[tool.importlinter.contracts]]
id = "same-layer-translation"
name = "D3: translation does not import the other modules of its layer (review)"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
  "ayvu.translation",
  "ayvu.translation_plan",
  "ayvu.translation_pipeline",
  "ayvu.translation_engine",
  "ayvu.translation_document",
  "ayvu.translation_context",
  "ayvu.context_execution",
  "ayvu.context_source",
  "ayvu.chunking",
  "ayvu.translate_project",
  "ayvu.translate_batch",
  "ayvu.batch_output_policy",
  "ayvu.preflight",
  "ayvu.resume_reuse",
]
forbidden_modules = [
  "ayvu.review_application",
  "ayvu.review_exchange",
  "ayvu.review_export",
  "ayvu.review_import",
]

[[tool.importlinter.contracts]]
id = "same-layer-review"
