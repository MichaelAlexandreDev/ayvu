[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ayvu"
version = "0.0.1"
description = "CLI para traduzir EPUBs com tradutor local HTTP, preservando a estrutura do livro."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "S.Ralt" }
]
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
classifiers = [
  "Private :: Do Not Upload"
]
dependencies = [
  "ebooklib>=0.18",
  "beautifulsoup4>=4.12",
  "lxml>=4.9",
  "requests>=2.31",
  "typer>=0.9",
  "rich>=13.0",
  "rapidfuzz>=3.0"
]

[project.optional-dependencies]
desktop = [
  "PySide6-Essentials==6.11.2"
]
dev = [
  "pytest>=7.4",
  "pyyaml>=6.0",
  "import-linter>=2.1"
]

[project.scripts]
ayvu = "ayvu.interfaces.cli.app:app"
ayvu-desktop = "ayvu.interfaces.desktop.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "core: the tests that pull requests run on GitHub; see CORE_TEST_FILES in tests/conftest.py",
]

# Import contracts for D3 and D11 of docs/architecture/decisions/package-structure.md (REF-03, #271).
# Each ignored import is a violation that exists today, with the issue that removes it. An ignore that no
# longer matches fails the check, so this list can only shrink.
[tool.importlinter]
root_package = "ayvu"

[[tool.importlinter.contracts]]
id = "layers"
name = "D3: one-way layers (docs/architecture/decisions/package-structure.md)"
type = "layers"
containers = ["ayvu"]
exhaustive = true
layers = [
  "interfaces",
  "composition",
  "v1",
  "recovery",
  "review",
  "translation",
  "projects",
  "preferences",
  "knowledge : providers : formats",
  "artifacts",
  "provenance",
  "jobs",
  "content : content_use_cases : network : library : (application)",
  "kernel",
]
ignore_imports = [
  "ayvu.recovery.store -> ayvu.v1.resume",  # REF-18 (#286): recovery stops reading the v1 resume file when v1 is retired
  "ayvu.recovery.store -> ayvu.v1.resume_scan",  # REF-18 (#286): recovery stops reading the v1 resume file when v1 is retired
  "ayvu.knowledge.cache.admin -> ayvu.v1.cache_format",  # REF-18 (#286): the v1 cache is retired with v1
  "ayvu.knowledge.cache.admin_store -> ayvu.v1.cache",  # REF-18 (#286): the v1 cache is retired with v1
  "ayvu.knowledge.cache.schema -> ayvu.v1.cache",  # REF-18 (#286): the v1 cache is retired with v1
  "ayvu.content_use_cases -> ayvu.formats",  # REF-07 (#275): content use cases need a home above formats (open question)
]

[[tool.importlinter.contracts]]
id = "v1-quarantine"
name = "D7: only composition imports v1 (the layers contract covers the modules below it)"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
  "ayvu.interfaces",
]
forbidden_modules = [
  "ayvu.v1",
]

[[tool.importlinter.contracts]]
id = "same-layer-knowledge"
name = "D3: knowledge does not import the other modules of its layer (providers, formats)"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
  "ayvu.knowledge",
]
forbidden_modules = [
  "ayvu.providers",
  "ayvu.formats",
]

[[tool.importlinter.contracts]]
id = "same-layer-providers"
name = "D3: providers does not import the other modules of its layer (knowledge, formats)"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
  "ayvu.providers",
]
forbidden_modules = [
  "ayvu.knowledge",
]

[[tool.importlinter.contracts]]
id = "same-layer-formats"
name = "D3: formats does not import the other modules of its layer (knowledge, providers)"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
  "ayvu.formats",
]
forbidden_modules = [
  "ayvu.providers",
]
ignore_imports = [
]

[[tool.importlinter.contracts]]
id = "same-layer-content"
name = "D3: content does not import the other modules of its layer (network, library, application)"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
  "ayvu.content",
  "ayvu.content_use_cases",
]
forbidden_modules = [
  "ayvu.network",
  "ayvu.library",
]

[[tool.importlinter.contracts]]
id = "same-layer-network"
name = "D3: network does not import the other modules of its layer (content, library, application)"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
  "ayvu.network",
]
forbidden_modules = [
  "ayvu.content",
  "ayvu.content_use_cases",
  "ayvu.library",
]

[[tool.importlinter.contracts]]
id = "same-layer-library"
name = "D3: library does not import the other modules of its layer (content, network, application)"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
  "ayvu.library",
]
forbidden_modules = [
  "ayvu.content",
  "ayvu.content_use_cases",
  "ayvu.network",
]
