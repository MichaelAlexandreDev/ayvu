version: 2

# Version updates arrive as one pull request per ecosystem per week, to save CI minutes.
# Security updates are not grouped, so each one still opens its own pull request.

updates:
  - package-ecosystem: uv
    directory: "/"
    groups:
      python-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python

  - package-ecosystem: github-actions
    directory: "/"
    groups:
      github-actions-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels:
      - dependencies
