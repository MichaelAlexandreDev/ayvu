[project]
name = "ayvu-secret-store-research"
version = "0.0.0"
requires-python = "==3.14.*"
dependencies = [
  "keyring==25.7.0",
  "SecretStorage==3.5.0",
  "jeepney==0.9.0",
  "cryptography==50.0.2",
  "cffi==2.1.1",
  "pycparser==3.12",
  "jaraco.classes==3.4.0",
  "jaraco.context==6.1.2",
  "jaraco.functools==4.1.0",
  "more-itertools==11.2.1",
