[tool.uv]
package = false

# Somente classes proibidas para testes negativos. Nunca backend candidato.
# Pin de pesquisa ainda não resolvido/verificado neste ambiente sem rede.
[dependency-groups]
rejected = ["keyrings.alt==5.0.2"]
